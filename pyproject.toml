[project]
name = "ownquesta-agent-api"
version = "0.0.1"
description = "Demo FastAPI agent API (Hello endpoint)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "langchain>=1.2.6",
  "langchain-core>=1.2.7",
  "langchain-openai>=1.1.7",
  "langgraph>=1.0.6",
  "pandas>=2.3.3",
  "python-multipart>=0.0.21",
  "uvicorn[standard]>=0.29",
]

[tool.uvicorn]
app = "main:app"
host = "127.0.0.1"
port = 8000
reload = true
